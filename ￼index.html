<div id="welcomeView" class="login"><div class="loginbox center"><div style="font-size:70px;color:#c97d8c">♡</div><h1>情侶小金庫</h1><div class="center muted" style="font-size:16px;line-height:1.7">兩個人的生活，<br>一起記、一清二楚，也一起慢慢存 ♡</div><div style="height:22px"></div><button class="btn" style="width:100%" onclick="showInfo()">開始使用</button><div class="muted center" style="margin-top:18px">自製情侶共享記帳 Web App</div></div></div>
<div id="infoView" class="login hidden"><div class="loginbox"><h1>使用前請先看看 ♡</h1><div class="muted" style="line-height:1.7"><p>「情侶小金庫」是個人製作的情侶共享記帳網站，並非銀行、金融機構或專業財務顧問服務。</p><p>資料會使用第三方雲端服務保存。請勿輸入完整信用卡號、網銀密碼、身分證號、驗證碼等高度敏感資訊。</p><p>統計、預算與負債結果供日常整理使用，請自行確認資料正確性。</p></div><div class="stack"><button class="btn" onclick="showAuth()">我了解，繼續</button><button class="btn secondary" onclick="show('welcomeView')">返回</button></div></div></div>
<div id="loginView" class="login hidden"><div class="loginbox"><div class="logo">♡</div><h1>登入情侶小金庫</h1><div id="loginNotice"></div><div class="stack"><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="密碼（至少 6 個字元）" autocomplete="current-password"><button class="btn" onclick="signIn()">登入</button><button class="btn pink" onclick="show('registerView')">第一次使用？建立帳號</button><button class="btn secondary" onclick="resetPassword()">忘記密碼</button><button class="btn secondary" onclick="show('infoView')">返回</button></div></div></div>
<div id="registerView" class="login hidden"><div class="loginbox"><div class="logo">♡</div><h1>建立帳號</h1><div id="registerNotice"></div><div class="stack"><input id="regName" placeholder="你的暱稱"><input id="regEmail" type="email" placeholder="Email"><input id="regPassword" type="password" placeholder="密碼（至少 6 個字元）"><button class="btn" onclick="signUp()">建立帳號</button><button class="btn secondary" onclick="show('loginView')">返回登入</button></div></div></div>
<div id="setupView" class="login hidden"><div class="loginbox"><div class="logo">💗</div><h1>建立你們的小金庫 ♡</h1><p class="muted center">建立共同帳本，或輸入另一半給你的邀請碼。</p><div id="setupStepHousehold"><div class="stack"><input id="householdName" value="我們的小金庫" maxlength="40"><input id="myNickname" placeholder="你在帳本裡的暱稱"><button class="btn pink" onclick="createHousehold()">建立小金庫</button><div class="center muted">或</div><input id="joinCodeInput" placeholder="6 碼邀請碼" maxlength="6" style="text-transform:uppercase"><input id="joinNickname" placeholder="你在帳本裡的暱稱"><button class="btn secondary" onclick="joinHousehold()">加入小金庫</button></div></div><div id="setupCodeBox" class="hidden"><div class="notice ok center">建立成功！<br><br>邀請碼：<b id="createdCode" style="font-size:24px"></b><br><br>把這 6 碼傳給另一半。</div><button class="btn" style="width:100%" onclick="finishSetup()">進入情侶小金庫</button></div></div></div>
<div id="appView" class="app hidden"><header class="top"><div class="toprow"><div><h1 id="appTitle">情侶小金庫 ♡</h1><div class="sub"><span id="whoText"></span> ・ <span id="syncText">雲端同步中</span></div></div><button class="gear" onclick="settingsModal()">⚙️</button></div></header><main><section id="page-home"></section><section id="page-record" class="hidden"></section><section id="page-budget" class="hidden"></section><section id="page-cv_assets" class="hidden"></section><section id="page-cv_debts" class="hidden"></section><section id="page-stats" class="hidden"></section></main><nav class="tabs"><button class="tab active" data-page="home"><span class="ico">🏠</span>首頁</button><button class="tab" data-page="record"><span class="ico">✍🏻</span>記帳</button><button class="tab" data-page="budget"><span class="ico">🎯</span>預算</button><button class="tab" data-page="cv_assets"><span class="ico">💰</span>資產</button><button class="tab" data-page="cv_debts"><span class="ico">💳</span>負債</button><button class="tab" data-page="stats"><span class="ico">📊</span>統計</button></nav></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL='https://voybgizucenhlrhqymtv.supabase.co';
const SUPABASE_KEY='sb_publishable_hbwOAWroWCDZjxCS1mHzBw_ik8JaUs4';
const {createClient}=supabase;
const sb=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

const PAYMENT_METHODS=['現金','信用卡','簽帳金融卡','銀行轉帳','行動支付','共同帳戶','其他'];
const INCOME_CATS=['薪資','獎金','兼職','投資','退款','其他'];
const EXPENSE_CATS=['早餐','午餐','晚餐','點心','飲料','交通','購物','生活用品','生活費','寵物','娛樂','房租','水費','電費','醫療','社交','數位','貸款','保險','手機／網路','訂閱','服飾','美容','旅遊','禮物','家用','其他','存錢'];
const BUDGET_CATS=['交通','伙食','存錢','預備金'];
const FOOD_CATS=['早餐','午餐','晚餐','點心','飲料'];

let session=null,profile=null,household=null,householdId=null;
let cv_transactions=[],cv_budgets=[],budgetDefinitions=[],cv_assets=[],cv_debts=[],debtPayments=[],creditCards=[],recurringExpenses=[];
let currentPage='home',currentStatsRange='month',currentMonth='',chart=null,channels=[];
function payerOptions(){const names=(window.householdMembers||[]).map(x=>x.nickname).filter(Boolean);return [...new Set([...names,profile?.display_name].filter(Boolean).concat(['共同']))]}
window.householdMembers=[];

const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:2});
const localISO=d=>{d=new Date(d);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},today=()=>localISO(new Date()),ym=d=>String(d||today()).slice(0,7);
currentMonth=ym(today());
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const errText=e=>e?.message||String(e||'發生錯誤');
const actualMonth=()=>ym(today()),monthLabel=m=>{const[y,mo]=m.split('-');return `${y} 年 ${Number(mo)} 月`},monthStartDate=m=>m===actualMonth()?today():`${m}-01`;
function addMonthsDate(dateStr,offset){const d=new Date(dateStr+'T12:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+offset);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return localISO(d)}
function addMonthsYM(m,offset){const[y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+offset,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function safeMonthDate(m,day){const[y,mo]=m.split('-').map(Number),last=new Date(y,mo,0).getDate();return `${m}-${String(Math.min(Number(day)||1,last)).padStart(2,'0')}`}
function monthNav(){return `<div class="card" style="padding:10px 14px"><div class="monthnav"><button class="btn secondary" onclick="changeMonth(-1)">〈</button><div class="monthtitle">${monthLabel(currentMonth)}</div>${currentMonth!==actualMonth()?'<button class="btn secondary small todaybtn" onclick="goCurrentMonth()">本月</button>':''}<button class="btn secondary" onclick="changeMonth(1)">〉</button></div></div>`}
function changeMonth(offset){const[y,m]=currentMonth.split('-').map(Number),d=new Date(y,m-1+offset,1);currentMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderAll();goPage(currentPage)}
function goCurrentMonth(){currentMonth=actualMonth();renderAll();goPage(currentPage)}
function show(id){['welcomeView','infoView','loginView','registerView','setupView','appView'].forEach(x=>$('#'+x).classList.add('hidden'));$('#'+id).classList.remove('hidden')}
function notice(text,ok=false){$('#loginNotice').innerHTML=`<div class="notice ${ok?'ok':''}">${esc(text)}</div>`}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function showInfo(){show('infoView')}
function showAuth(){show('loginView')}
async function signUp(){const name=$('#regName').value.trim(),email=$('#regEmail').value.trim(),password=$('#regPassword').value;if(!name||!email||password.length<6)return $('#registerNotice').innerHTML='<div class="notice">請填暱稱、Email，密碼至少 6 個字元。</div>';const{data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});if(error)return $('#registerNotice').innerHTML='<div class="notice">'+esc(errText(error))+'</div>';$('#registerNotice').innerHTML='<div class="notice ok">帳號已建立。若 Supabase 有開啟 Email 驗證，請先到信箱完成驗證再登入。</div>'}
async function resetPassword(){const email=$('#email').value.trim();if(!email)return notice('請先輸入 Email');const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});notice(error?'寄送失敗：'+errText(error):'重設密碼信已寄出，請到信箱查看。',!error)}
async function signIn(){notice('登入中…',true);const email=$('#email').value.trim(),password=$('#password').value;const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)return notice('登入失敗：'+errText(error));session=data.session;await bootstrap()}
async function signOut(){await sb.auth.signOut();location.reload()}
async function bootstrap(){const{data:{session:s}}=await sb.auth.getSession();session=s;if(!session)return show('welcomeView');const uid=session.user.id;let{data:p}=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();if(!p){const display_name=session.user.user_metadata?.display_name||session.user.email?.split('@')[0]||'我';await sb.from('profiles').upsert({id:uid,display_name});p={id:uid,display_name}}profile=p;const{data:hm}=await sb.from('cv_household_members').select('*').eq('user_id',uid).maybeSingle();if(!hm){show('setupView');return}householdId=hm.household_id;const{data:h}=await sb.from('cv_households').select('*').eq('id',householdId).single();household=h;const{data:members}=await sb.from('cv_household_members').select('*').eq('household_id',householdId);window.householdMembers=members||[];show('appView');$('#whoText').textContent=(hm.nickname||profile.display_name)+' 已登入';$('#appTitle').textContent=(household?.name||'情侶小金庫')+' ♡';await loadAll();await generateRecurringForMonth(actualMonth(),true);subscribeRealtime();renderAll();goPage(currentPage)}
async function saveProfile(name){const{error}=await sb.from('profiles').insert({id:session.user.id,display_name:name});if(error)return alert(errText(error));profile={id:session.user.id,display_name:name};$('#setupStepProfile').classList.add('hidden');$('#setupStepHousehold').classList.remove('hidden')}
async function createHousehold(){const name=$('#householdName').value.trim()||'我們的小金庫',nickname=$('#myNickname').value.trim()||profile?.display_name||'我';const{data,error}=await sb.rpc('cv_create_household',{p_name:name,p_nickname:nickname});if(error)return alert(errText(error));$('#setupStepHousehold').classList.add('hidden');$('#setupCodeBox').classList.remove('hidden');$('#createdCode').textContent=data}
async function joinHousehold(){const code=$('#joinCodeInput').value.trim().toUpperCase(),nickname=$('#joinNickname').value.trim()||profile?.display_name||'我';if(code.length!==6)return alert('請輸入 6 碼邀請碼');const{error}=await sb.rpc('cv_join_household_by_code',{p_code:code,p_nickname:nickname});if(error)return alert(errText(error));await finishSetup()}
async function finishSetup(){await bootstrap()}

async function loadAll(){
  $('#syncText').textContent='同步中…';
  const[t,b,bd,a,d,p,c,r,hm]=await Promise.all([
    sb.from('cv_transactions').select('*').eq('household_id',householdId).order('date',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('cv_budgets').select('*').eq('household_id',householdId),
    sb.from('cv_budget_definitions').select('*').eq('household_id',householdId).order('sort_order').order('created_at'),
    sb.from('cv_assets').select('*').eq('household_id',householdId).order('created_at'),
    sb.from('cv_debts').select('*').eq('household_id',householdId).order('created_at',{ascending:false}),
    sb.from('cv_debt_payments').select('*').eq('household_id',householdId).order('due_date'),
    sb.from('cv_credit_cards').select('*').eq('household_id',householdId).order('created_at'),
    sb.from('cv_recurring_expenses').select('*').eq('household_id',householdId).order('created_at'),
    sb.from('cv_household_members').select('*').eq('household_id',householdId)
  ]);
  cv_transactions=t.data||[];cv_budgets=b.data||[];budgetDefinitions=bd.data||[];cv_assets=a.data||[];cv_debts=d.data||[];debtPayments=p.data||[];creditCards=c.data||[];recurringExpenses=r.data||[];window.householdMembers=hm.data||window.householdMembers||[];
  $('#syncText').textContent='已同步';
}
function subscribeRealtime(){channels.forEach(c=>sb.removeChannel(c));channels=[];['cv_transactions','cv_budgets','cv_budget_definitions','cv_assets','cv_debts','cv_debt_payments','cv_credit_cards','cv_recurring_expenses'].forEach(table=>{const c=sb.channel('rt-'+table).on('postgres_changes',{event:'*',schema:'public',table,filter:`household_id=eq.${householdId}`},async()=>{await loadAll();renderAll();goPage(currentPage)}).subscribe();channels.push(c)})}
function renderAll(){renderHome();renderRecord();renderBudget();renderAssets();renderDebts();renderStats()}
const monthTx=m=>cv_transactions.filter(x=>ym(x.date)===m),isRealExpense=x=>x.kind==='expense'&&x.category!=='存錢',sumBy=(arr,fn)=>arr.filter(fn).reduce((s,x)=>s+Number(x.amount),0);

function activeBudgetDefinitions(){return budgetDefinitions.filter(d=>d.is_active!==false).sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0)||String(a.name).localeCompare(String(b.name),'zh-Hant'))}
function budgetDefinitionById(id){return budgetDefinitions.find(d=>String(d.id)===String(id))||null}
function budgetDefinitionByName(name){return budgetDefinitions.find(d=>d.name===name)||null}
function suggestedBudgetDefinition(category){return activeBudgetDefinitions().find(d=>Array.isArray(d.expense_categories)&&d.expense_categories.includes(category))||null}
function legacyBudgetCategory(category){if(FOOD_CATS.includes(category))return '伙食';if(category==='交通')return '交通';if(category==='存錢')return '存錢';return null}
function txBudgetDefinition(tx){
  if(tx?.budget_definition_id){const d=budgetDefinitionById(tx.budget_definition_id);if(d)return d}
  if(tx?.budget_id){const b=cv_budgets.find(x=>String(x.id)===String(tx.budget_id));if(b?.definition_id){const d=budgetDefinitionById(b.definition_id);if(d)return d}if(b?.category){const d=budgetDefinitionByName(b.category);if(d)return d}}
  if(tx?.budget_category){const d=budgetDefinitionByName(tx.budget_category);if(d)return d}
  const legacy=legacyBudgetCategory(tx?.category);return legacy?budgetDefinitionByName(legacy):null
}
function budgetCategoryForTx(tx){return txBudgetDefinition(tx)?.name||tx?.budget_category||legacyBudgetCategory(tx?.category)||null}
function budgetSpentByDefinition(defId,m){return monthTx(m).filter(x=>x.kind==='expense'&&String(txBudgetDefinition(x)?.id||'')===String(defId)).reduce((s,x)=>s+Number(x.amount),0)}
function budgetSpent(cat,m){const d=budgetDefinitionByName(cat);return d?budgetSpentByDefinition(d.id,m):0}
function budgetInfoByDefinition(defId,m){
  const def=budgetDefinitionById(defId);if(!def)return{id:defId,amount:0,inherited:false,from:null,budgetRowId:null};
  const exact=cv_budgets.find(x=>x.month===m&&String(x.definition_id)===String(defId));
  if(exact)return{id:defId,amount:Number(exact.amount||0),inherited:false,from:m,budgetRowId:exact.id};
  const prior=cv_budgets.filter(x=>String(x.definition_id)===String(defId)&&x.month<m).sort((a,b)=>b.month.localeCompare(a.month))[0];
  return prior?{id:defId,amount:Number(prior.amount||0),inherited:true,from:prior.month,budgetRowId:prior.id}:{id:defId,amount:0,inherited:false,from:null,budgetRowId:null}
}
function budgetInfo(cat,m){const d=budgetDefinitionByName(cat);return d?budgetInfoByDefinition(d.id,m):{id:null,amount:0,inherited:false,from:null,budgetRowId:null}}
function budgetOptions(m,selected=''){
  const selectedDef=budgetDefinitionById(selected)||budgetDefinitionByName(selected);
  return `<option value="" ${!selected?'selected':''}>不扣任何預算</option>`+
    activeBudgetDefinitions().map(d=>{const info=budgetInfoByDefinition(d.id,m),remain=info.amount-budgetSpentByDefinition(d.id,m);return `<option value="${d.id}" ${selectedDef&&String(selectedDef.id)===String(d.id)?'selected':''}>${esc(d.name)}｜${info.amount?`剩餘 $${fmt(remain)}`:'尚未設定金額'}</option>`}).join('')
}
async function ensureBudgetRow(defId,m){
  if(!defId)return null;
  const exact=cv_budgets.find(x=>x.month===m&&String(x.definition_id)===String(defId));if(exact)return exact.id;
  const def=budgetDefinitionById(defId);if(!def)throw new Error('找不到指定的預算');
  const prior=cv_budgets.filter(x=>String(x.definition_id)===String(defId)&&x.month<m).sort((a,b)=>b.month.localeCompare(a.month))[0];
  const amount=prior?Number(prior.amount||0):0;
  const{data,error}=await sb.from('cv_budgets').insert({household_id:householdId,month:m,category:def.name,amount,definition_id:def.id}).select().single();
  if(error)throw error;cv_budgets.push(data);return data.id
}
async function ensureBudgetId(catOrId,m){const d=budgetDefinitionById(catOrId)||budgetDefinitionByName(catOrId);return d?ensureBudgetRow(d.id,m):null}
function selectedBudgetCategory(tx){return txBudgetDefinition(tx)?.id||''}

function assetName(id){return cv_assets.find(a=>String(a.id)===String(id))?.name||''}
function cardName(id){return creditCards.find(c=>String(c.id)===String(id))?.name||''}
async function adjustAssetBalance(assetId,delta){if(!assetId||!delta)return;const a=cv_assets.find(x=>String(x.id)===String(assetId));if(!a)throw new Error('找不到要連動的資產');const next=Number(a.balance||0)+Number(delta);const{error}=await sb.from('cv_assets').update({balance:next}).eq('id',assetId);if(error)throw error;a.balance=next}
async function syncSavingAsset(oldTx,newTx){
  const oldSaving=oldTx&&oldTx.kind==='expense'&&oldTx.category==='存錢'&&oldTx.asset_id;
  const newSaving=newTx&&newTx.kind==='expense'&&newTx.category==='存錢'&&newTx.asset_id;
  const deltas=new Map();
  if(oldSaving)deltas.set(String(oldTx.asset_id),(deltas.get(String(oldTx.asset_id))||0)-Number(oldTx.amount||0));
  if(newSaving)deltas.set(String(newTx.asset_id),(deltas.get(String(newTx.asset_id))||0)+Number(newTx.amount||0));
  for(const[id,delta] of deltas.entries())if(delta)await adjustAssetBalance(id,delta);
}

function cardStatementMonth(card,dateStr){const d=new Date(dateStr+'T12:00:00'),m=ym(dateStr);return d.getDate()<=Number(card.closing_day||1)?m:addMonthsYM(m,1)}
function cardDueDate(card,statementMonth){return safeMonthDate(addMonthsYM(statementMonth,1),card.payment_day||1)}
function cardBillAmount(card,m){return cv_transactions.filter(x=>x.kind==='expense'&&String(x.credit_card_id)===String(card.id)&&cardStatementMonth(card,x.date)===m).reduce((s,x)=>s+Number(x.amount),0)}
function creditCardOptions(selected=''){return `<option value="">不指定信用卡</option>`+creditCards.map(c=>`<option value="${c.id}" ${String(c.id)===String(selected)?'selected':''}>${esc(c.owner_name?c.owner_name+'・':'')}${esc(c.name)}</option>`).join('')}
function paymentLooksCard(v){return /卡|信用卡/.test(v||'')}

function txItem(x){
  const cls=x.category==='存錢'?'saving':x.kind,budgetCat=x.kind==='expense'?budgetCategoryForTx(x):null,parts=[esc(x.date),esc(x.payment_method||'收入')];
  if(x.paid_by)parts.push(esc(x.paid_by));if(budgetCat)parts.push('🎯 '+esc(budgetCat));if(x.credit_card_id)parts.push('💳 '+esc(cardName(x.credit_card_id)));if(x.asset_id&&x.category==='存錢')parts.push('🏦 '+esc(assetName(x.asset_id)));if(x.recurring_expense_id)parts.push('🔁 固定');
  return `<div class="item"><span class="dot"></span><div class="item-main"><div class="item-title">${esc(x.category)} ${x.note?`・${esc(x.note)}`:''}</div><div class="item-sub">${parts.join(' ・ ')}</div></div><div class="amount ${cls}">${x.kind==='income'?'+':'-'}$${fmt(x.amount)}</div><button class="btn secondary small" onclick="editTxModal('${x.id}')">編輯</button></div>`
}

function refreshBudgetSelector(){const select=$('#txBudget'),date=$('#txDate')?.value;if(!select||!date)return;const current=select.value;select.innerHTML=budgetOptions(ym(date),current);updateBudgetHint()}
function updateBudgetHint(){const el=$('#budgetHint'),select=$('#txBudget'),date=$('#txDate')?.value;if(!el||!select||!date)return;const defId=select.value;if(!defId){el.textContent='這筆支出不會計入任何預算。';return}const d=budgetDefinitionById(defId),info=budgetInfoByDefinition(defId,ym(date)),remain=info.amount-budgetSpentByDefinition(defId,ym(date));el.innerHTML=info.amount?`目前「${esc(d?.name||'預算')}」預算剩餘 <b>$${fmt(remain)}</b>。`:`「${esc(d?.name||'預算')}」目前沒有設定預算金額，仍可先記帳。`}
function suggestBudgetFromCategory(){const s=$('#txBudget');if(!s)return;const d=suggestedBudgetDefinition($('#txCategory')?.value);s.value=d?.id||'';updateBudgetHint()}
function onRecordCategoryChange(){suggestBudgetFromCategory();const saving=(window._txKind||'expense')==='expense'&&$('#txCategory')?.value==='存錢';$('#assetWrap')?.classList.toggle('hidden',!saving)}
function updateCreditCardWrap(){const show=(window._txKind||'expense')==='expense'&&paymentLooksCard($('#txPayment')?.value)&&creditCards.length;$('#creditCardWrap')?.classList.toggle('hidden',!show);if(!show&&$('#txCreditCard'))$('#txCreditCard').value=''}
function applyRememberedRecordDefaults(){const p=localStorage.getItem('budget-last-payment'),paid=localStorage.getItem('budget-last-paidby'),cat=localStorage.getItem('budget-last-expense-cat'),budget=localStorage.getItem('budget-last-definition-id');if(p&&PAYMENT_METHODS.includes(p))$('#txPayment').value=p;if(paid&&payerOptions().includes(paid))$('#txPaidBy').value=paid;if(cat&&EXPENSE_CATS.includes(cat))$('#txCategory').value=cat;if(budget&&budgetDefinitionById(budget))$('#txBudget').value=budget}
function setKind(kind){window._txKind=kind;$('#segExpense').classList.toggle('on',kind==='expense');$('#segIncome').classList.toggle('on',kind==='income');const cats=kind==='expense'?EXPENSE_CATS:INCOME_CATS;$('#txCategory').innerHTML=cats.map(x=>`<option>${x}</option>`).join('');const remembered=localStorage.getItem(kind==='expense'?'budget-last-expense-cat':'budget-last-income-cat');if(remembered&&cats.includes(remembered))$('#txCategory').value=remembered;$('#paymentWrap').classList.toggle('hidden',kind==='income');$('#paidByWrap').classList.toggle('hidden',kind==='income');$('#budgetWrap').classList.toggle('hidden',kind==='income');$('#assetWrap').classList.add('hidden');$('#creditCardWrap').classList.add('hidden');if(kind==='expense'){const rb=localStorage.getItem('budget-last-definition-id');if(rb&&budgetDefinitionById(rb))$('#txBudget').value=rb;else suggestBudgetFromCategory();onRecordCategoryChange();updateCreditCardWrap()}}

async function addTransaction(){
  const amount=Number($('#txAmount').value);if(!amount)return alert('請輸入金額');
  const kind=window._txKind||'expense',date=$('#txDate').value,row={household_id:householdId,user_id:session.user.id,kind,date,amount,category:$('#txCategory').value,note:$('#txNote').value.trim(),budget_id:null,budget_category:null,budget_definition_id:null,asset_id:null,credit_card_id:null};
  localStorage.setItem(kind==='expense'?'budget-last-expense-cat':'budget-last-income-cat',row.category);
  if(kind==='expense'){
    row.payment_method=$('#txPayment').value;row.paid_by=$('#txPaidBy').value;
    const budgetDefId=$('#txBudget').value;const budgetDef=budgetDefinitionById(budgetDefId);row.budget_definition_id=budgetDefId||null;row.budget_category=budgetDef?.name||null;if(budgetDefId){try{row.budget_id=await ensureBudgetRow(budgetDefId,ym(date))}catch(e){return alert('預算連結失敗：'+errText(e))}localStorage.setItem('budget-last-definition-id',budgetDefId)}else localStorage.removeItem('budget-last-definition-id');
    if(row.category==='存錢')row.asset_id=$('#txAsset').value||null;
    if(paymentLooksCard(row.payment_method))row.credit_card_id=$('#txCreditCard')?.value||null;
    localStorage.setItem('budget-last-payment',row.payment_method);localStorage.setItem('budget-last-paidby',row.paid_by)
  }
  const{data,error}=await sb.from('cv_transactions').insert(row).select().single();if(error)return alert(errText(error));
  try{await syncSavingAsset(null,data)}catch(e){await sb.from('cv_transactions').delete().eq('id',data.id);return alert('記帳沒有完成，資產連動失敗：'+errText(e))}
  await loadAll();renderAll();goPage('record');alert('已記錄 ♡')
}

function renderBudget(){
  const m=currentMonth,defs=activeBudgetDefinitions();
  const cards=defs.map(d=>{const info=budgetInfoByDefinition(d.id,m),limit=info.amount,spent=budgetSpentByDefinition(d.id,m),remain=limit-spent,pct=limit?Math.min(100,spent/limit*100):0;return `<div class="card"><div class="section-title"><h3>${esc(d.name)} ${info.inherited?'<span class="pill">沿用 '+info.from+'</span>':''}</h3><div class="row" style="flex:0 0 auto"><button class="btn secondary small" onclick="editBudgetDefinition('${d.id}')">規則</button><button class="btn secondary small" onclick="editBudgetAmount('${d.id}','${m}',${limit})">金額</button></div></div><div><b>$${fmt(spent)}</b> / $${fmt(limit)}</div><div class="progress"><i class="${remain<0?'over':''}" style="width:${pct}%"></i></div><div class="${remain<0?'expense':'muted'}" style="margin-top:7px">${remain<0?'超支':'剩餘'} $${fmt(Math.abs(remain))}</div><div class="muted" style="margin-top:7px">自動分類：${(d.expense_categories||[]).length?(d.expense_categories||[]).map(esc).join('、'):'未設定'}</div></div>`}).join('');
  $('#page-budget').innerHTML=`${monthNav()}<div class="section-title"><h3>${monthLabel(m)} 每月預算</h3><button class="btn pink" onclick="editBudgetDefinition()">＋新增預算</button></div>${cards||'<div class="muted center">還沒有預算，先新增一包吧。</div>'}<div class="muted center">新月份沒有單獨設定時，會沿用最近一個月的金額；預算名稱與自動分類規則可以隨時修改。</div>`
}
function editBudgetAmount(defId,m,amount){const d=budgetDefinitionById(defId);if(!d)return;openModal(`<div class="sheet-head"><h3>設定 ${esc(d.name)} 預算</h3><button class="x" onclick="closeModal()">×</button></div><div class="stack"><div class="muted">這次儲存只設定 ${monthLabel(m)}；其他月份不會被改掉。</div><input id="budgetAmount" type="number" min="0" value="${amount}"><button class="btn" onclick="saveBudgetAmount('${defId}','${m}')">儲存</button></div>`)}
async function saveBudgetAmount(defId,m){const d=budgetDefinitionById(defId);if(!d)return;const amount=Number($('#budgetAmount').value||0),existing=cv_budgets.find(b=>b.month===m&&String(b.definition_id)===String(defId));let q;if(existing)q=sb.from('cv_budgets').update({amount,category:d.name}).eq('id',existing.id);else q=sb.from('cv_budgets').insert({household_id:householdId,month:m,category:d.name,amount,definition_id:defId});const{error}=await q;if(error)return alert(errText(error));closeModal();await loadAll();renderAll();goPage('budget')}
function editBudgetDefinition(id=''){
  const d=id?budgetDefinitionById(id):null,selected=new Set(d?.expense_categories||[]);
  const checks=EXPENSE_CATS.map(c=>`<label style="display:flex;align-items:center;gap:8px;padding:7px 2px"><input type="checkbox" name="budgetDefCat" value="${esc(c)}" style="width:20px;flex:0 0 20px" ${selected.has(c)?'checked':''}><span>${esc(c)}</span></label>`).join('');
  openModal(`<div class="sheet-head"><h3>${d?'編輯':'新增'}預算</h3><button class="x" onclick="closeModal()">×</button></div><div class="stack"><div class="label">預算名稱</div><input id="budgetDefName" placeholder="例如：生活費、約會、寵物" value="${esc(d?.name||'')}"><div class="label">哪些支出分類預設扣這包</div><div class="card" style="margin:0;max-height:320px;overflow:auto">${checks}</div><div class="hint">同一個支出分類建議只指定給一包預算。儲存時若它原本屬於其他預算，系統會自動從舊預算移除。</div><button class="btn" onclick="saveBudgetDefinition('${d?.id||''}')">儲存</button>${d?`<button class="btn danger" onclick="deleteBudgetDefinition('${d.id}')">刪除此預算</button>`:''}</div>`)

async function saveBudgetDefinition(id=''){
  const name=$('#budgetDefName').value.trim();if(!name)return alert('請輸入預算名稱');
  const cats=[...document.querySelectorAll('input[name="budgetDefCat"]:checked')].map(x=>x.value);
  const duplicate=budgetDefinitions.find(d=>d.name===name&&String(d.id)!==String(id));if(duplicate)return alert('已經有同名預算了');
  for(const d of budgetDefinitions){if(String(d.id)===String(id))continue;const filtered=(d.expense_categories||[]).filter(c=>!cats.includes(c));if(filtered.length!==(d.expense_categories||[]).length){const{error}=await sb.from('cv_budget_definitions').update({expense_categories:filtered}).eq('id',d.id);if(error)return alert('更新其他預算規則失敗：'+errText(error))}}
  let defId=id;if(id){const{error}=await sb.from('cv_budget_definitions').update({name,expense_categories:cats}).eq('id',id);if(error)return alert(errText(error));const{error:be}=await sb.from('cv_budgets').update({category:name}).eq('definition_id',id);if(be)return alert('預算名稱已更新，但月份資料同步失敗：'+errText(be));const{error:te}=await sb.from('cv_transactions').update({budget_category:name}).eq('budget_definition_id',id);if(te)return alert('預算名稱已更新，但記帳顯示名稱同步失敗：'+errText(te))}
  else{const nextOrder=Math.max(0,...budgetDefinitions.map(d=>Number(d.sort_order||0)))+10;const{data,error}=await sb.from('cv_budget_definitions').insert({household_id:householdId,name,expense_categories:cats,sort_order:nextOrder,is_active:true}).select().single();if(error)return alert(errText(error));defId=data.id;const inheritedAmount=0;const{error:be}=await sb.from('cv_budgets').insert({household_id:householdId,month:currentMonth,category:name,amount:inheritedAmount,definition_id:defId});if(be)return alert('預算已建立，但本月金額資料建立失敗：'+errText(be))}
  closeModal();await loadAll();renderAll();goPage('budget')
}
async function deleteBudgetDefinition(id){
  const d=budgetDefinitionById(id);if(!d)return;
  const used=cv_transactions.some(t=>String(t.budget_definition_id)===String(id)||String(txBudgetDefinition(t)?.id||'')===String(id));
  if(used){if(!confirm(`「${d.name}」已有記帳紀錄。刪除後舊記帳會保留，但不再歸屬任何預算。確定要刪除嗎？`))return}else if(!confirm(`確定刪除「${d.name}」預算嗎？`))return;
  const{error}=await sb.from('cv_budget_definitions').delete().eq('id',id);if(error)return alert(errText(error));closeModal();await loadAll();renderAll();goPage('budget')
}

async function addDebt(){const name=$('#debtName').value.trim(),total=Number($('#debtTotal').value),installments=Number($('#debtInstallments').value),payment=Number($('#debtPayment').value);if(!name||!total||!payment)return alert('請填完整名稱、總金額與每期金額');const{error}=await sb.rpc('cv_create_debt_with_schedule',{p_household_id:householdId,p_name:name,p_source:$('#debtSource').value,p_total_amount:total,p_installments:installments,p_payment_amount:payment,p_first_due_date:$('#debtFirst').value,p_note:$('#debtNote').value.trim()});if(error)return alert(errText(error));closeModal();await loadAll();renderAll();goPage('cv_debts')}
function editDebtModal(id){const d=cv_debts.find(x=>String(x.id)===String(id));if(!d)return;const first=debtPayments.filter(p=>String(p.debt_id)===String(id)).sort((a,b)=>a.installment_no-b.installment_no)[0]?.due_date||today();openModal(`<div class="sheet-head"><h3>編輯負債</h3><button class="x" onclick="closeModal()">×</button></div><div class="stack"><input id="editDebtName" value="${esc(d.name||'')}"><select id="editDebtSource">${optionTags(['信用卡','銀行／貸款','分期平台','其他'],d.source)}</select><input id="editDebtTotal" type="number" step="0.01" value="${Number(d.total_amount||0)}"><select id="editDebtInstallments">${Array.from({length:72},(_,i)=>`<option value="${i+1}" ${Number(d.installments)===(i+1)?'selected':''}>${i+1}期</option>`).join('')}</select><input id="editDebtPayment" type="number" step="0.01" value="${Number(d.payment_amount||0)}"><div class="label">首次還款日</div><input id="editDebtFirst" type="date" value="${first}"><textarea id="editDebtNote">${esc(d.note||'')}</textarea><div class="notice">修改期數、每期金額或首次還款日會重新建立分期表；已勾選的期數會盡量依期數保留。</div><button class="btn" onclick="saveDebtEdit('${d.id}')">儲存修改</button><button class="btn danger" onclick="deleteDebt('${d.id}')">刪除整筆負債</button></div>`)}
function buildSchedule(debtId,total,installments,payment,first){const rows=[];for(let i=1;i<=installments;i++){let amount=payment;if(i===installments){const rest=total-payment*(installments-1);if(rest>0)amount=rest}rows.push({household_id:householdId,debt_id:debtId,installment_no:i,due_date:addMonthsDate(first,i-1),amount})}return rows}
async function saveDebtEdit(id){const name=$('#editDebtName').value.trim(),total=Number($('#editDebtTotal').value),installments=Number($('#editDebtInstallments').value),payment=Number($('#editDebtPayment').value),first=$('#editDebtFirst').value;if(!name||!total||!installments||!payment||!first)return alert('請把資料填完整');const old=debtPayments.filter(p=>String(p.debt_id)===String(id)),oldMap=new Map(old.map(p=>[Number(p.installment_no),p])),update={name,source:$('#editDebtSource').value,total_amount:total,installments,payment_amount:payment,note:$('#editDebtNote').value.trim()};const{error:de}=await sb.from('cv_debts').update(update).eq('id',id);if(de)return alert(errText(de));const desired=buildSchedule(id,total,installments,payment,first);for(const row of desired){const exists=oldMap.get(row.installment_no);const q=exists?sb.from('cv_debt_payments').update({due_date:row.due_date,amount:row.amount}).eq('id',exists.id):sb.from('cv_debt_payments').insert(row);const{error}=await q;if(error)return alert('負債資料已更新，但分期表更新失敗：'+errText(error))}const extra=old.filter(p=>Number(p.installment_no)>installments).map(p=>p.id);if(extra.length){const{error}=await sb.from('cv_debt_payments').delete().in('id',extra);if(error)return alert('多餘期數刪除失敗：'+errText(error))}closeModal();await loadAll();renderAll();goPage('cv_debts')}
async function deleteDebt(id){if(!confirm('確定要刪除這整筆負債和所有分期嗎？'))return;const{error:pe}=await sb.from('cv_debt_payments').delete().eq('debt_id',id);if(pe)return alert(errText(pe));const{error}=await sb.from('cv_debts').delete().eq('id',id);if(error)return alert(errText(error));closeModal();await loadAll();renderAll();goPage('cv_debts')}
async function togglePayment(id,checked){const{error}=await sb.from('cv_debt_payments').update({is_paid:checked,paid_at:checked?new Date().toISOString():null}).eq('id',id);if(error)alert(errText(error));else{await loadAll();renderAll();goPage('cv_debts')}}

async function generateRecurringForMonth(m,silent=false){
  if(!session||!householdId||!recurringExpenses.length)return 0;
  let created=0;
  for(const r of recurringExpenses.filter(x=>x.is_active)){
    if(cv_transactions.some(t=>String(t.recurring_expense_id)===String(r.id)&&ym(t.date)===m))continue;
    const date=safeMonthDate(m,r.day_of_month),row={household_id:householdId,user_id:session.user.id,kind:'expense',date,amount:Number(r.amount||0),category:r.category||'生活費',payment_method:r.payment_method||null,paid_by:r.paid_by||null,note:[r.name,r.note].filter(Boolean).join('・'),recurring_expense_id:r.id,budget_category:r.budget_category||null,budget_definition_id:null,budget_id:null,asset_id:null,credit_card_id:null};
    if(row.budget_category){const d=budgetDefinitionByName(row.budget_category);if(d){row.budget_definition_id=d.id;try{row.budget_id=await ensureBudgetRow(d.id,m)}catch(e){if(!silent)alert(`固定支出「${r.name}」預算連結失敗：${errText(e)}`);continue}}}
    const{data,error}=await sb.from('cv_transactions').insert(row).select().single();
    if(error){if(!String(error.message||'').toLowerCase().includes('duplicate')&&!silent)alert(`固定支出「${r.name}」產生失敗：${errText(error)}`);continue}
    cv_transactions.push(data);created++;
  }
  if(created)await loadAll();
  if(!silent)alert(created?`已產生 ${created} 筆 ${monthLabel(m)}固定支出 ♡`:`${monthLabel(m)}的固定支出都已經存在了。`);
  return created
}
function recurringModal(){openModal(`<div class="sheet-head"><h3>固定支出管理</h3><button class="x" onclick="closeModal()">×</button></div><div class="stack"><button class="btn pink" onclick="recurringEditModal()">＋新增固定支出</button><button class="btn secondary" onclick="generateRecurringForMonth('${actualMonth()}',false).then(()=>{renderAll();recurringModal()})">產生本月固定支出</button>${recurringExpenses.map(r=>`<div class="item"><div class="item-main"><div class="item-title">${r.is_active?'🔁':'⏸️'} ${esc(r.name)}</div><div class="item-sub">每月 ${r.day_of_month} 日 ・ $${fmt(r.amount)} ・ ${esc(r.category)}${r.budget_category?' ・ 🎯 '+esc(r.budget_category):''}</div></div><button class="btn secondary small" onclick="recurringEditModal('${r.id}')">編輯</button></div>`).join('')||'<div class="muted center">還沒有固定支出</div>'}</div>`)}
function recurringEditModal(id){const r=id?recurringExpenses.find(x=>String(x.id)===String(id)):null;openModal(`<div class="sheet-head"><h3>${r?'編輯':'新增'}固定支出</h3><button class="x" onclick="closeModal()">×</button></div><div class="stack"><div class="label">名稱</div><input id="reName" placeholder="例如：手機費、Netflix" value="${esc(r?.name||'')}"><div class="label">每月金額</div><input id="reAmount" type="number" min="0" step="0.01" value="${r?Number(r.amount):''}"><div class="label">支出分類</div><select id="reCategory">${optionTags(EXPENSE_CATS,r?.category||'生活費')}</select><div class="label">從哪個預算扣</div><select id="reBudget"><option value="">不扣任何預算</option>${activeBudgetDefinitions().map(d=>`<option value="${d.id}" ${(r?.budget_category===d.name)?'selected':''}>${esc(d.name)}</option>`).join('')}</select><div class="label">付款方式</div><select id="rePayment"><option value="">之後再決定</option>${PAYMENT_METHODS.map(p=>`<option ${r?.payment_method===p?'selected':''}>${p}</option>`).join('')}</select><div class="label">誰付款</div><select id="rePaidBy"><option value="">之後再決定</option>${payerOptions().map(p=>`<option ${r?.paid_by===p?'selected':''}>${p}</option>`).join('')}</select><div class="label">每月幾號</div><input id="reDay" type="number" min="1" max="31" value="${r?.day_of_month||1}"><div class="label">備註</div><textarea id="reNote">${esc(r?.note||'')}</textarea><label class="row" style="justify-content:flex-start"><input id="reActive" type="checkbox" style="width:22px;flex:0 0 22px" ${r?.is_active===false?'':'checked'}><span>啟用自動產生</span></label><button class="btn" onclick="saveRecurring('${r?.id||''}')">儲存</button>${r?`<button class="btn danger" onclick="deleteRecurring('${r.id}')">刪除此固定支出</button>`:''}</div>`)}
async function saveRecurring(id){const name=$('#reName').value.trim(),amount=Number($('#reAmount').value),day=Number($('#reDay').value);if(!name||!amount||day<1||day>31)return alert('請填完整名稱、金額與每月日期');const budgetDef=budgetDefinitionById($('#reBudget').value);const row={household_id:householdId,name,amount,category:$('#reCategory').value,budget_category:budgetDef?.name||null,payment_method:$('#rePayment').value||null,paid_by:$('#rePaidBy').value||null,day_of_month:day,note:$('#reNote').value.trim(),is_active:$('#reActive').checked};const q=id?sb.from('cv_recurring_expenses').update(row).eq('id',id):sb.from('cv_recurring_expenses').insert(row),{error}=await q;if(error)return alert(errText(error));await loadAll();recurringModal()}
async function deleteRecurring(id){if(!confirm('刪除固定支出設定？已經產生的歷史記帳不會刪除。'))return;const{error}=await sb.from('cv_recurring_expenses').delete().eq('id',id);if(error)return alert(errText(error));await loadAll();recurringModal()}

function rangeTx(){const now=new Date();let start,end=new Date(now);end.setHours(23,59,59,999);if(currentStatsRange==='week'){start=new Date(now);start.setDate(now.getDate()-6);start.setHours(0,0,0,0)}if(currentStatsRange==='month'){const[y,m]=currentMonth.split('-').map(Number);start=new Date(y,m-1,1);end=new Date(y,m,0,23,59,59,999)}if(currentStatsRange==='year'){const y=Number(currentMonth.slice(0,4));start=new Date(y,0,1);end=new Date(y,11,31,23,59,59,999)}return cv_transactions.filter(x=>{const d=new Date(x.date+'T12:00:00');return d>=start&&d<=end})}
function renderStats(){const tx=rangeTx(),exp=tx.filter(isRealExpense),income=sumBy(tx,x=>x.kind==='income'),expense=exp.reduce((s,x)=>s+Number(x.amount),0),saved=sumBy(tx,x=>x.kind==='expense'&&x.category==='存錢'),payments=PAYMENT_METHODS.map(p=>[p,exp.filter(x=>x.payment_method===p).reduce((s,x)=>s+Number(x.amount),0)]),cats=[...new Set(exp.map(x=>x.category))].map(c=>[c,exp.filter(x=>x.category===c).reduce((s,x)=>s+Number(x.amount),0)]).sort((a,b)=>b[1]-a[1]);$('#page-stats').innerHTML=`${monthNav()}<div class="seg"><button class="${currentStatsRange==='week'?'on':''}" onclick="setStats('week')">最近 7 天</button><button class="${currentStatsRange==='month'?'on':''}" onclick="setStats('month')">選定月份</button><button class="${currentStatsRange==='year'?'on':''}" onclick="setStats('year')">${currentMonth.slice(0,4)} 年</button></div><div style="height:12px"></div><div class="grid2"><div class="mini">收入<b class="income">$${fmt(income)}</b></div><div class="mini">實際支出<b class="expense">$${fmt(expense)}</b></div><div class="mini">存錢<b class="saving">$${fmt(saved)}</b></div><div class="mini">差額<b>$${fmt(income-expense)}</b></div></div><div style="height:12px"></div><div class="card"><div class="section-title"><h3>付款方式統計</h3></div><canvas id="payChart"></canvas></div><div class="section-title"><h3>花費分類排行</h3></div><div class="list">${cats.map(([c,v],i)=>`<div class="item rank"><div class="rankno">${i+1}</div><div class="item-main"><div class="item-title">${esc(c)}</div></div><b>$${fmt(v)}</b></div>`).join('')||'<div class="muted center">這段期間沒有支出</div>'}</div><div style="height:12px"></div><div class="section-title"><h3>付款方式明細</h3></div><div class="list">${payments.map(([p,v])=>`<div class="item"><span class="dot"></span><div class="item-main"><div class="item-title">${esc(p)}</div></div><b>$${fmt(v)}</b></div>`).join('')}</div>`;setTimeout(()=>drawChart(payments),0)}
function setStats(r){currentStatsRange=r;renderStats()}
function drawChart(arr){const el=$('#payChart');if(!el)return;if(chart)chart.destroy();chart=new Chart(el,{type:'bar',data:{labels:arr.map(x=>x[0]),datasets:[{data:arr.map(x=>x[1]),borderWidth:1}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true},x:{ticks:{maxRotation:65,minRotation:45,font:{size:10}}}}}})}

function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function exportCSV(){const rows=[['資料類型','日期/月','名稱/分類','扣款預算','連動資產','信用卡','金額','付款方式/來源','誰付款','備註','狀態']];cv_transactions.forEach(x=>rows.push(['記帳',x.date,x.category,x.kind==='expense'?budgetCategoryForTx(x)||'':'',x.asset_id?assetName(x.asset_id):'',x.credit_card_id?cardName(x.credit_card_id):'',x.amount,x.payment_method||'',x.paid_by||'',x.note||'',x.kind]));budgetDefinitions.forEach(x=>rows.push(['預算規則','',x.name,(x.expense_categories||[]).join('、'),'','',0,'','','',x.is_active===false?'停用':'啟用']));cv_budgets.forEach(x=>rows.push(['預算',x.month,x.category,'','','',x.amount,'','','','']));cv_assets.forEach(x=>rows.push(['資產','',x.name,'','','',x.balance,'','',x.note||'','']));cv_debts.forEach(x=>rows.push(['負債','',x.name,'','','',x.total_amount,x.source||'','',x.note||'',`${x.installments||''}期`]));creditCards.forEach(x=>rows.push(['信用卡設定','',x.name,'','','',0,`結帳${x.closing_day}/繳款${x.payment_day}`,x.owner_name||'','','']));recurringExpenses.forEach(x=>rows.push(['固定支出','',x.name,x.budget_category||'','','',x.amount,x.payment_method||'',x.paid_by||'',x.note||'',x.is_active?'啟用':'停用']));debtPayments.forEach(x=>{const d=cv_debts.find(d=>String(d.id)===String(x.debt_id));rows.push(['分期',x.due_date,d?.name||'負債','','','',x.amount,d?.source||'','','',x.is_paid?'已繳':'未繳'])});const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`CoupleVault-${today()}.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}

function settingsModal(){openModal(`<div class="sheet-head"><h3>設定</h3><button class="x" onclick="closeModal()">×</button></div><div class="stack"><div class="card" style="margin:0"><div class="label">目前登入</div><div style="font-weight:800;margin-top:6px">${esc(profile?.display_name||'')}</div><div class="muted">${esc(session?.user?.email||'')}</div></div><div class="card" style="margin:0"><div class="label">共同帳本</div><div style="font-weight:800;margin-top:6px">${esc(household?.name||'情侶小金庫')}</div><div class="muted">資料會同步到加入同一共同帳本的帳號。</div></div><button class="btn secondary" onclick="creditCardsModal()">💳 信用卡管理</button><button class="btn secondary" onclick="recurringModal()">🔁 固定支出管理</button><button class="btn secondary" onclick="goCurrentMonth();closeModal()">回到現在月份</button><button class="btn secondary" onclick="exportCSV()">匯出 CSV 備份</button><button class="btn danger" onclick="signOut()">登出這支裝置</button></div>`)}
function goPage(p){currentPage=p;document.querySelectorAll('[id^=page-]').forEach(x=>x.classList.add('hidden'));$('#page-'+p).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===p))}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>goPage(b.dataset.page)));

bootstrap()
</script>
